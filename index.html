<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>参加者ページ</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="page-header">
      <p class="eyebrow">Participant</p>
      <h1>参加者ページ</h1>
      <nav class="page-nav">
        <button type="button" class="nav-button" data-target="admin.html">管理者ページへ</button>
      </nav>
    </header>

    <section class="panel">
      <div class="panel-head">
        <div>
          <p class="mini-label">候補日程</p>
          <h2>参加可能な時間を選択</h2>
        </div>
      </div>

      <div class="candidate-readonly-wrap">
        <div id="candidateDateList" class="candidate-list" aria-live="polite"></div>
      </div>

      <div class="schedule-controls" style="margin:10px 0; display:flex; gap:10px; align-items:center;">
        <label style="color:var(--muted);">予定切替</label>
        <select id="scheduleSelect"></select>
        <button id="newScheduleBtn" type="button" class="nav-button">新規予定</button>
        <button id="deleteScheduleBtn" type="button" class="secondary-btn">削除</button>
      </div>

      <div class="participant-actions">
        <label class="field" for="participantName">
          <span>参加者名</span>
          <div class="inline-field">
            <input id="participantName" type="text" placeholder="例：山田 太郎" />
            <button id="saveAvailabilityBtn" type="button">登録</button>
          </div>
        </label>
      </div>

      <div class="schedule-wrap">
        <table class="schedule-table" aria-label="予定調整表">
          <thead id="scheduleHead"></thead>
          <tbody id="scheduleBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = 'scheduleTableData';
    const SUPABASE_URL = 'https://nwyfvlxjkonxpnkhuiuv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_kew3a0QTt7awm_saFyRj_A_Hgb6aQcq';
    const SUPABASE_TABLE = 'schedule_state';
    const HOUR_START = 9;
    const HOUR_END = 20;

    const MARK_SYMBOLS = {
      circle: '○',
      triangle: '△',
      cross: '×'
    };

    const MARK_CYCLE = [null, 'circle', 'triangle', 'cross'];

    const defaultState = {
      candidateDates: [],
      participantEntries: [
        { name: '', slots: [] }
      ],
      participantDraft: {}
    };

    const scheduleHead = document.getElementById('scheduleHead');
    const scheduleBody = document.getElementById('scheduleBody');
    const candidateDateList = document.getElementById('candidateDateList');
    const participantNameInput = document.getElementById('participantName');
    const saveAvailabilityBtn = document.getElementById('saveAvailabilityBtn');
    const activeEditTargets = new Set();

    function updateActionButtonState() {
      const hasName = participantNameInput.value.trim().length > 0;
      saveAvailabilityBtn.disabled = !hasName;
    }

    function deepClone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function isValidState(value) {
      return value && Array.isArray(value.candidateDates) && Array.isArray(value.participantEntries);
    }

    function getAppState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return deepClone({ schedules: [{ id: 'default', title: 'Default', payload: deepClone(defaultState) }], activeScheduleId: 'default' });

      try {
        const parsed = JSON.parse(raw);
        // legacy payload -> wrap
        if (isValidState(parsed)) {
          const app = { schedules: [{ id: 'default', title: 'Default', payload: parsed }], activeScheduleId: 'default' };
          migrateSlots(app);
          return app;
        }

        if (parsed && Array.isArray(parsed.schedules)) {
          migrateSlots(parsed);
          return parsed;
        }
      } catch (error) {
        // fall through
      }

      return deepClone({ schedules: [{ id: 'default', title: 'Default', payload: deepClone(defaultState) }], activeScheduleId: 'default' });
    }

    function getState() {
      const app = getAppState();
      const activeId = app.activeScheduleId || (app.schedules[0] && app.schedules[0].id);
      const sched = (app.schedules || []).find((s) => s.id === activeId) || (app.schedules[0] || { payload: deepClone(defaultState) });
      return sched.payload;
    }

    async function saveAppState(appState) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));

      if (!SUPABASE_URL || SUPABASE_URL.includes('<Project URL>') || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('<anon public key>')) {
        return;
      }

      try {
        const checkResponse = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?select=id&id=eq.1`, {
          headers: getSupabaseHeaders(),
          cache: 'no-store'
        });

        if (!checkResponse.ok) {
          return;
        }

        const existingRows = await checkResponse.json();
        const hasRow = Array.isArray(existingRows) && existingRows.some((row) => row.id === 1);

        const url = hasRow ? `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?id=eq.1` : `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}`;
        const method = hasRow ? 'PATCH' : 'POST';
        const body = hasRow ? JSON.stringify({ payload: appState }) : JSON.stringify({ id: 1, payload: appState });

        await fetch(url, {
          method,
          headers: {
            ...getSupabaseHeaders(),
            Prefer: hasRow ? 'resolution=merge-duplicates' : 'resolution=merge-duplicates'
          },
          body
        });
      } catch (error) {
        // Ignore network issues and keep local fallback behavior.
      }
    }

    async function saveState(statePayload) {
      const app = getAppState();
      const activeId = app.activeScheduleId || (app.schedules[0] && app.schedules[0].id);
      let sched = (app.schedules || []).find((s) => s.id === activeId);
      if (!sched) {
        sched = { id: activeId || `s_${Date.now()}`, title: activeId || 'New', payload: statePayload };
        app.schedules = app.schedules || [];
        app.schedules.push(sched);
        app.activeScheduleId = sched.id;
      } else {
        sched.payload = statePayload;
      }

      await saveAppState(app);
    }

    function migrateSlots(appState) {
      if (!appState) return;

      // If this looks like a legacy schedule payload (candidateDates present), wrap it
      if (isValidState(appState)) {
        // legacy single-payload -> convert to app shape
        const payload = appState;
        appState = {
          schedules: [{ id: 'default', title: 'Default', payload }],
          activeScheduleId: 'default'
        };
      }

      if (Array.isArray(appState.schedules)) {
        appState.schedules = appState.schedules.map((sched) => {
          const state = sched.payload || { candidateDates: [], participantEntries: [], participantDraft: {} };

          state.participantEntries = (state.participantEntries || []).map((person) => {
            const rawSlots = person.slots || [];
            const normalized = rawSlots.map((s) => {
              if (!s) return null;
              if (typeof s === 'string') return { id: s, mark: 'circle' };
              if (typeof s === 'object' && s.id) return s;
              return null;
            }).filter(Boolean);
            return { ...person, slots: normalized };
          });

          const drafts = state.participantDraft || {};
          Object.keys(drafts).forEach((name) => {
            const arr = drafts[name] || [];
            drafts[name] = arr.map((s) => {
              if (!s) return null;
              if (typeof s === 'string') return { id: s, mark: 'circle' };
              if (typeof s === 'object' && s.id) return s;
              return null;
            }).filter(Boolean);
          });

          state.participantDraft = drafts;
          return { ...sched, payload: state };
        });
      }
    }

    function getSlotMark(name, slotId, appState) {
      const state = appState && appState.schedules ? (appState.schedules.find(s => s.id === appState.activeScheduleId) || {}).payload : null;
      const draft = (state && state.participantDraft && state.participantDraft[name]) || [];
      const inDraft = draft.find((s) => s.id === slotId);
      if (inDraft) return inDraft.mark || null;

      const entry = (state && state.participantEntries || []).find((p) => p.name === name);
      if (!entry) return null;
      const found = (entry.slots || []).find((s) => s.id === slotId);
      return found ? (found.mark || null) : null;
    }

    // Schedule selector helpers
    function renderScheduleSelector() {
      const select = document.getElementById('scheduleSelect');
      if (!select) return;
      const app = getAppState();
      select.innerHTML = '';
      (app.schedules || []).forEach((s) => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.title || s.id;
        if (app.activeScheduleId === s.id) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function createNewSchedule() {
      const title = window.prompt('新しい予定のタイトルを入力してください');
      if (!title) return;
      const app = getAppState();
      const id = `s_${Date.now()}`;
      const payload = deepClone(defaultState);
      app.schedules = app.schedules || [];
      app.schedules.push({ id, title, payload });
      app.activeScheduleId = id;
      saveAppState(app).then(() => {
        renderScheduleSelector();
        renderCandidateDates();
        renderTable();
      });
    }

    function deleteCurrentSchedule() {
      const app = getAppState();
      const id = app.activeScheduleId;
      if (!id) return;
      const sched = (app.schedules || []).find(s => s.id === id);
      if (!sched) return;
      const ok = window.confirm(`${sched.title || sched.id} を削除してもよろしいですか？`);
      if (!ok) return;
      app.schedules = (app.schedules || []).filter(s => s.id !== id);
      if (!app.schedules.length) {
        const newid = 'default';
        app.schedules.push({ id: newid, title: 'Default', payload: deepClone(defaultState) });
        app.activeScheduleId = newid;
      } else {
        app.activeScheduleId = app.schedules[0].id;
      }
      saveAppState(app).then(() => {
        renderScheduleSelector();
        renderCandidateDates();
        renderTable();
      });
    }

    function getSupabaseHeaders() {
      return {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json'
      };
    }

    async function syncStateFromServer() {
      if (!SUPABASE_URL || SUPABASE_URL.includes('<Project URL>') || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('<anon public key>')) {
        return;
      }

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?select=payload&id=eq.1`, {
          headers: getSupabaseHeaders(),
          cache: 'no-store'
        });

        if (!response.ok) return;

        const rows = await response.json();
        const remoteState = rows && rows[0] ? rows[0].payload : null;

        if (isValidState(remoteState)) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(remoteState));
        }
      } catch (error) {
        // Ignore network errors and continue using local fallback data.
      }
    }

    async function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

      if (!SUPABASE_URL || SUPABASE_URL.includes('<Project URL>') || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('<anon public key>')) {
        return;
      }

      try {
        const checkResponse = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?select=id&id=eq.1`, {
          headers: getSupabaseHeaders(),
          cache: 'no-store'
        });

        if (!checkResponse.ok) {
          return;
        }

        const existingRows = await checkResponse.json();
        const hasRow = Array.isArray(existingRows) && existingRows.some((row) => row.id === 1);

        const url = hasRow ? `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?id=eq.1` : `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}`;
        const method = hasRow ? 'PATCH' : 'POST';
        const body = hasRow ? JSON.stringify({ payload: state }) : JSON.stringify({ id: 1, payload: state });

        await fetch(url, {
          method,
          headers: {
            ...getSupabaseHeaders(),
            Prefer: hasRow ? 'resolution=merge-duplicates' : 'resolution=merge-duplicates'
          },
          body
        });
      } catch (error) {
        // Ignore network issues and keep local fallback behavior.
      }
    }

    function formatDate(dateString) {
      const date = new Date(`${dateString}T00:00:00`);
      return `${date.getMonth() + 1}/${date.getDate()}`;
    }

    function buildSlots(candidateDates) {
      const slots = [];

      candidateDates
        .slice()
        .sort()
        .forEach((dateString) => {
          for (let hour = HOUR_START; hour <= HOUR_END; hour += 1) {
            const iso = `${dateString}T${String(hour).padStart(2, '0')}:00:00`;
            slots.push({
              id: iso,
              label: `${formatDate(dateString)} ${String(hour).padStart(2, '0')}:00`
            });
          }
        });

      return slots;
    }

    function renderCandidateDates() {
      const state = getState();
      candidateDateList.innerHTML = '';

      if (!state.candidateDates.length) {
        const empty = document.createElement('p');
        empty.className = 'empty-info';
        empty.textContent = '候補日がまだありません';
        candidateDateList.appendChild(empty);
        return;
      }

      state.candidateDates
        .slice()
        .sort()
        .forEach((dateString) => {
          const pill = document.createElement('span');
          pill.className = 'candidate-pill readonly';
          pill.textContent = formatDate(dateString);
          candidateDateList.appendChild(pill);
        });
    }

    function finishEditing(targetName) {
      const state = getState();

      if (!targetName || !activeEditTargets.has(targetName)) {
        return;
      }

      const draftArr = state.participantDraft[targetName] || [];
      // dedupe by id
      const draftSlots = draftArr.reduce((acc, s) => {
        if (!acc.some((x) => x.id === s.id)) acc.push(s);
        return acc;
      }, []);

      const entry = state.participantEntries.find((person) => person.name === targetName);

      if (entry) {
        entry.slots = draftSlots;
      }

      delete state.participantDraft[targetName];
      activeEditTargets.delete(targetName);
      participantNameInput.value = '';
      saveState(state);
      updateActionButtonState();
      renderTable();
    }

    function renderHeader(state) {
      scheduleHead.innerHTML = '';
      const users = [...state.participantEntries.map((person) => person.name)];

      const headerRow = document.createElement('tr');
      const dateLabelCell = document.createElement('th');
      dateLabelCell.textContent = '日付';
      dateLabelCell.className = 'date-col';
      headerRow.appendChild(dateLabelCell);

      const timeLabelCell = document.createElement('th');
      timeLabelCell.textContent = '時間';
      timeLabelCell.className = 'time-col';
      headerRow.appendChild(timeLabelCell);

      users.forEach((userName) => {
        const userCell = document.createElement('th');
        userCell.className = 'day-header';

        const nameWrap = document.createElement('div');
        nameWrap.className = 'person-name-wrap';

        const nameText = document.createElement('span');
        nameText.textContent = userName;
        nameText.className = 'person-name-text';

        const editButton = document.createElement('button');
        editButton.type = 'button';
        editButton.className = activeEditTargets.has(userName) ? 'row-edit-btn active' : 'row-edit-btn';
        editButton.textContent = activeEditTargets.has(userName) ? '完了' : '編集';
        editButton.addEventListener('click', (event) => {
          event.stopPropagation();

          if (activeEditTargets.has(userName)) {
            finishEditing(userName);
            return;
          }

          const state = getState();
          const entry = state.participantEntries.find((person) => person.name === userName);
          if (entry && !state.participantDraft[userName]) {
            state.participantDraft[userName] = [...entry.slots];
            saveState(state);
          }

          activeEditTargets.add(userName);
          updateActionButtonState();
          renderTable();
        });

        nameWrap.appendChild(nameText);
        nameWrap.appendChild(editButton);
        userCell.appendChild(nameWrap);
        headerRow.appendChild(userCell);
      });

      scheduleHead.appendChild(headerRow);
    }

    // NOTE: slots are stored as objects {id, mark}
    function getCurrentParticipantSlots(name, state) {
      const entry = state.participantEntries.find((person) => person.name === name) || { slots: [] };

      if (activeEditTargets.has(name) && state.participantDraft[name]) {
        return (state.participantDraft[name] || []).slice();
      }

      return (entry.slots || []).slice();
    }

    function renderTable() {
      const state = getState();
      const slots = buildSlots(state.candidateDates);
      scheduleBody.innerHTML = '';

      if (!slots.length) {
        scheduleHead.innerHTML = '';
        const row = document.createElement('tr');
        const empty = document.createElement('td');
        empty.colSpan = 2;
        empty.className = 'empty-state';
        empty.textContent = '候補日を追加すると、ここに予定表が表示されます';
        row.appendChild(empty);
        scheduleBody.appendChild(row);
        return;
      }

      const users = [...state.participantEntries.map((person) => person.name)];

      renderHeader(state);

      const dateGroups = new Map();
      const dateOrder = [];

      slots.forEach((slot) => {
        const dateKey = slot.id.slice(0, 10);
        if (!dateGroups.has(dateKey)) {
          dateGroups.set(dateKey, []);
          dateOrder.push(dateKey);
        }
        dateGroups.get(dateKey).push(slot);
      });

      dateOrder.forEach((dateKey) => {
        const daySlots = dateGroups.get(dateKey);

        daySlots.forEach((slot, index) => {
          const row = document.createElement('tr');

          if (index === 0) {
            const dateCell = document.createElement('th');
            dateCell.className = 'date-cell';
            dateCell.rowSpan = daySlots.length;
            dateCell.textContent = formatDate(dateKey);
            dateCell.title = dateKey;
            row.appendChild(dateCell);
          }

          const timeCell = document.createElement('th');
          timeCell.className = 'time-header';
          timeCell.textContent = slot.id.slice(11, 16);
          timeCell.title = slot.label;
          row.appendChild(timeCell);

          users.forEach((userName) => {
            const cell = document.createElement('td');
            const canEdit = activeEditTargets.has(userName);
            const mark = getSlotMark(userName, slot.id, getAppState());

            cell.className = mark ? 'slot selected' : 'slot';
            cell.dataset.person = userName;
            cell.dataset.slotId = slot.id;
            cell.setAttribute('role', 'button');
            cell.setAttribute('tabindex', '0');
            cell.textContent = mark ? (MARK_SYMBOLS[mark] || '') : '';
            cell.title = `${userName} ${slot.label}`;

            if (canEdit) {
              const handleSelection = () => toggleDraftSlot(userName, slot.id);
              cell.addEventListener('click', handleSelection);
              cell.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' || event.key === ' ') {
                  event.preventDefault();
                  handleSelection();
                }
              });
            } else {
              cell.style.cursor = 'default';
            }

            row.appendChild(cell);
          });

          scheduleBody.appendChild(row);
        });
      });
    }

    function toggleDraftSlot(name, slotId) {
      const state = getState();
      const cleanName = name.trim();
      if (!cleanName || !activeEditTargets.has(cleanName)) return;

      if (!state.participantDraft[cleanName]) {
        const entry = state.participantEntries.find((person) => person.name === cleanName);
        state.participantDraft[cleanName] = (entry ? (entry.slots || []).map((s) => ({ ...s })) : []);
      }

      const arr = state.participantDraft[cleanName];
      const idx = arr.findIndex((s) => s.id === slotId);
      let currentMark = null;
      if (idx >= 0) currentMark = arr[idx].mark || null;

      // cycle to next mark
      const nextMark = MARK_CYCLE[(MARK_CYCLE.indexOf(currentMark) + 1) % MARK_CYCLE.length];

      if (idx >= 0) {
        if (nextMark === null) {
          arr.splice(idx, 1);
        } else {
          arr[idx].mark = nextMark;
        }
      } else {
        if (nextMark !== null) {
          arr.push({ id: slotId, mark: nextMark });
        }
      }

      state.participantDraft[cleanName] = arr;
      saveState(state);
      renderTable();
    }

    function saveAvailability() {
      const state = getState();
      const name = participantNameInput.value.trim();

      if (!name) {
        participantNameInput.focus();
        return;
      }

      if (state.participantEntries.some((person) => person.name === name)) {
        alert('この名前はすでに登録されています。一覧の「編集」から修正してください。');
        participantNameInput.focus();
        return;
      }

      state.participantEntries.push({ name, slots: [] });
      participantNameInput.value = '';
      saveState(state);
      updateActionButtonState();
      renderTable();
    }

    document.querySelectorAll('.nav-button').forEach((button) => {
      button.addEventListener('click', () => {
        const target = button.dataset.target;
        if (target) {
          window.location.href = target;
        }
      });
    });

    saveAvailabilityBtn.addEventListener('click', saveAvailability);
    participantNameInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        saveAvailability();
      }
    });
    participantNameInput.addEventListener('input', () => {
      updateActionButtonState();
      renderTable();
    });

    participantNameInput.value = '';
    updateActionButtonState();
    syncStateFromServer();
    // wire schedule selector
    document.getElementById('newScheduleBtn').addEventListener('click', createNewSchedule);
    document.getElementById('deleteScheduleBtn').addEventListener('click', deleteCurrentSchedule);
    document.getElementById('scheduleSelect').addEventListener('change', (e) => {
      const app = getAppState();
      app.activeScheduleId = e.target.value;
      saveAppState(app).then(() => {
        renderCandidateDates();
        renderTable();
      });
    });
    renderScheduleSelector();
    renderCandidateDates();
    renderTable();
  </script>
</body>
</html>
