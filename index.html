<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>予定調整表</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="page-header">
      <p class="eyebrow">Schedule</p>
      <h1>日程調整表</h1>
    </header>

    <section class="toolbar">
      <div class="date-builder">
        <label class="field" for="candidateDate">
          <span>候補日を追加</span>
          <div class="inline-field">
            <input id="candidateDate" type="date" />
            <button id="addCandidateBtn" type="button">追加</button>
          </div>
        </label>
        <div id="candidateDateList" class="candidate-list" aria-live="polite"></div>
      </div>

      <label class="field" for="participantName">
        <span>参加者を追加</span>
        <div class="inline-field">
          <input id="participantName" type="text" placeholder="例：山田 太郎" />
          <button id="addPersonBtn" type="button">追加</button>
        </div>
      </label>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <p class="mini-label">候補日程</p>
          <h2>都合の良い日時を選択</h2>
        </div>
      </div>

      <div class="schedule-wrap">
        <table class="schedule-table" aria-label="予定調整表">
          <thead id="scheduleHead"></thead>
          <tbody id="scheduleBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = 'scheduleTableData';
    const HOUR_START = 9;
    const HOUR_END = 20;

    const defaultState = {
      candidateDates: ['2026-08-15', '2026-08-17', '2026-08-20'],
      people: [
        { name: '山田', slots: ['2026-08-15T10:00:00', '2026-08-15T11:00:00', '2026-08-17T13:00:00'] },
        { name: '佐藤', slots: ['2026-08-15T09:00:00', '2026-08-17T14:00:00', '2026-08-20T15:00:00'] },
        { name: '鈴木', slots: ['2026-08-17T10:00:00', '2026-08-17T11:00:00', '2026-08-20T12:00:00'] }
      ]
    };

    const scheduleHead = document.getElementById('scheduleHead');
    const scheduleBody = document.getElementById('scheduleBody');
    const candidateDateList = document.getElementById('candidateDateList');
    const participantNameInput = document.getElementById('participantName');
    const candidateDateInput = document.getElementById('candidateDate');
    const addPersonBtn = document.getElementById('addPersonBtn');
    const addCandidateBtn = document.getElementById('addCandidateBtn');

    function getState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return structuredClone(defaultState);

      try {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.candidateDates) && Array.isArray(parsed.people)) {
          return parsed;
        }
      } catch (error) {
        // Ignore invalid state and fall back to defaults.
      }

      return structuredClone(defaultState);
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function formatDate(dateString) {
      const date = new Date(`${dateString}T00:00:00`);
      return `${date.getMonth() + 1}/${date.getDate()}`;
    }

    function buildSlots(candidateDates) {
      const slots = [];

      candidateDates
        .slice()
        .sort()
        .forEach((dateString) => {
          for (let hour = HOUR_START; hour <= HOUR_END; hour += 1) {
            const iso = `${dateString}T${String(hour).padStart(2, '0')}:00:00`;
            slots.push({
              id: iso,
              label: `${formatDate(dateString)} ${String(hour).padStart(2, '0')}:00`
            });
          }
        });

      return slots;
    }

    function renderCandidateDates() {
      const state = getState();
      candidateDateList.innerHTML = '';

      if (!state.candidateDates.length) {
        const empty = document.createElement('p');
        empty.className = 'empty-info';
        empty.textContent = '候補日がまだありません';
        candidateDateList.appendChild(empty);
        return;
      }

      state.candidateDates
        .slice()
        .sort()
        .forEach((dateString) => {
          const pill = document.createElement('button');
          pill.type = 'button';
          pill.className = 'candidate-pill';
          pill.textContent = formatDate(dateString);

          const removeButton = document.createElement('span');
          removeButton.className = 'candidate-remove';
          removeButton.textContent = '×';
          removeButton.setAttribute('aria-label', `${dateString}を削除`);
          removeButton.addEventListener('click', (event) => {
            event.stopPropagation();
            removeCandidateDate(dateString);
          });

          pill.appendChild(removeButton);
          pill.addEventListener('click', () => {
            candidateDateInput.value = dateString;
          });

          candidateDateList.appendChild(pill);
        });
    }

    function renderHeader(slots) {
      scheduleHead.innerHTML = '';
      const row = document.createElement('tr');

      const nameCell = document.createElement('th');
      nameCell.textContent = '名前';
      nameCell.className = 'name-col';
      row.appendChild(nameCell);

      slots.forEach((slot) => {
        const th = document.createElement('th');
        th.textContent = slot.label;
        th.title = slot.label;
        row.appendChild(th);
      });

      scheduleHead.appendChild(row);
    }

    function renderTable() {
      const state = getState();
      const slots = buildSlots(state.candidateDates);
      scheduleBody.innerHTML = '';

      if (!slots.length) {
        scheduleHead.innerHTML = '';
        const row = document.createElement('tr');
        const empty = document.createElement('td');
        empty.colSpan = 2;
        empty.className = 'empty-state';
        empty.textContent = '候補日を追加すると、ここに予定表が表示されます';
        row.appendChild(empty);
        scheduleBody.appendChild(row);
        return;
      }

      renderHeader(slots);

      state.people.forEach((person) => {
        const row = document.createElement('tr');

        const nameCell = document.createElement('th');
        nameCell.textContent = person.name;
        nameCell.className = 'person-name';
        row.appendChild(nameCell);

        slots.forEach((slot) => {
          const cell = document.createElement('td');
          const selected = person.slots.includes(slot.id);

          cell.className = selected ? 'slot selected' : 'slot';
          cell.dataset.person = person.name;
          cell.dataset.slotId = slot.id;
          cell.setAttribute('role', 'button');
          cell.setAttribute('tabindex', '0');
          cell.textContent = selected ? '○' : '';
          cell.title = `${person.name} ${slot.label}`;

          const handleSelection = () => toggleSlot(person.name, slot.id);
          cell.addEventListener('click', handleSelection);
          cell.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              handleSelection();
            }
          });

          row.appendChild(cell);
        });

        scheduleBody.appendChild(row);
      });
    }

    function toggleSlot(personName, slotId) {
      const state = getState();
      const person = state.people.find((entry) => entry.name === personName);
      if (!person) return;

      const slotIndex = person.slots.indexOf(slotId);
      if (slotIndex >= 0) {
        person.slots.splice(slotIndex, 1);
      } else {
        person.slots.push(slotId);
      }

      saveState(state);
      renderTable();
    }

    function addPerson() {
      const value = participantNameInput.value.trim();
      if (!value) return;

      const state = getState();
      if (state.people.some((person) => person.name === value)) {
        participantNameInput.value = '';
        participantNameInput.focus();
        return;
      }

      state.people.push({ name: value, slots: [] });
      saveState(state);
      participantNameInput.value = '';
      renderTable();
      participantNameInput.focus();
    }

    function addCandidateDate() {
      const dateString = candidateDateInput.value;
      if (!dateString) return;

      const state = getState();

      if (state.candidateDates.includes(dateString)) {
        candidateDateInput.value = '';
        return;
      }

      state.candidateDates.push(dateString);
      state.candidateDates.sort();
      saveState(state);
      candidateDateInput.value = '';
      renderCandidateDates();
      renderTable();
    }

    function removeCandidateDate(dateString) {
      const state = getState();
      state.candidateDates = state.candidateDates.filter((date) => date !== dateString);
      state.people.forEach((person) => {
        person.slots = person.slots.filter((slot) => !slot.startsWith(`${dateString}T`));
      });
      saveState(state);
      renderCandidateDates();
      renderTable();
    }

    addCandidateBtn.addEventListener('click', addCandidateDate);
    candidateDateInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        addCandidateDate();
      }
    });

    addPersonBtn.addEventListener('click', addPerson);
    participantNameInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        addPerson();
      }
    });

    renderCandidateDates();
    renderTable();
  </script>
</body>
</html>
