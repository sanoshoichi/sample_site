<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>参加者ページ</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="page-header">
      <p class="eyebrow">Participant</p>
      <h1>参加者ページ</h1>
      <nav class="page-nav">
        <button type="button" class="nav-button" data-target="admin.html">管理者ページへ</button>
      </nav>
    </header>

    <section class="toolbar">
      <label class="field" for="participantName">
        <span>参加者名</span>
        <div class="inline-field">
          <input id="participantName" type="text" placeholder="例：山田 太郎" />
          <button id="saveAvailabilityBtn" type="button">登録</button>
        </div>
      </label>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <p class="mini-label">候補日程</p>
          <h2>参加可能な時間を選択</h2>
        </div>
      </div>

      <div class="candidate-readonly-wrap">
        <div id="candidateDateList" class="candidate-list" aria-live="polite"></div>
      </div>

      <div class="schedule-wrap">
        <table class="schedule-table" aria-label="予定調整表">
          <thead id="scheduleHead"></thead>
          <tbody id="scheduleBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = 'scheduleTableData';
    const HOUR_START = 9;
    const HOUR_END = 20;

    const defaultState = {
      candidateDates: ['2026-08-15', '2026-08-17', '2026-08-20'],
      participantEntries: [
        { name: '山田', slots: ['2026-08-15T10:00:00', '2026-08-15T11:00:00', '2026-08-17T13:00:00'] },
        { name: '佐藤', slots: ['2026-08-15T09:00:00', '2026-08-17T14:00:00', '2026-08-20T15:00:00'] },
        { name: '鈴木', slots: ['2026-08-17T10:00:00', '2026-08-17T11:00:00', '2026-08-20T12:00:00'] }
      ],
      participantDraft: {}
    };

    const scheduleHead = document.getElementById('scheduleHead');
    const scheduleBody = document.getElementById('scheduleBody');
    const candidateDateList = document.getElementById('candidateDateList');
    const participantNameInput = document.getElementById('participantName');
    const saveAvailabilityBtn = document.getElementById('saveAvailabilityBtn');

    function deepClone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function getState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return deepClone(defaultState);

      try {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.candidateDates) && Array.isArray(parsed.participantEntries)) {
          return parsed;
        }
      } catch (error) {
        // Ignore invalid state and fall back to defaults.
      }

      return deepClone(defaultState);
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function formatDate(dateString) {
      const date = new Date(`${dateString}T00:00:00`);
      return `${date.getMonth() + 1}/${date.getDate()}`;
    }

    function buildSlots(candidateDates) {
      const slots = [];

      candidateDates
        .slice()
        .sort()
        .forEach((dateString) => {
          for (let hour = HOUR_START; hour <= HOUR_END; hour += 1) {
            const iso = `${dateString}T${String(hour).padStart(2, '0')}:00:00`;
            slots.push({
              id: iso,
              label: `${formatDate(dateString)} ${String(hour).padStart(2, '0')}:00`
            });
          }
        });

      return slots;
    }

    function renderCandidateDates() {
      const state = getState();
      candidateDateList.innerHTML = '';

      if (!state.candidateDates.length) {
        const empty = document.createElement('p');
        empty.className = 'empty-info';
        empty.textContent = '候補日がまだありません';
        candidateDateList.appendChild(empty);
        return;
      }

      state.candidateDates
        .slice()
        .sort()
        .forEach((dateString) => {
          const pill = document.createElement('span');
          pill.className = 'candidate-pill readonly';
          pill.textContent = formatDate(dateString);
          candidateDateList.appendChild(pill);
        });
    }

    function renderHeader(slots) {
      scheduleHead.innerHTML = '';

      const dateGroups = new Map();
      const dateOrder = [];

      slots.forEach((slot) => {
        const dateKey = slot.id.slice(0, 10);
        if (!dateGroups.has(dateKey)) {
          dateGroups.set(dateKey, []);
          dateOrder.push(dateKey);
        }
        dateGroups.get(dateKey).push(slot);
      });

      const dayRow = document.createElement('tr');
      const nameCell = document.createElement('th');
      nameCell.textContent = '名前';
      nameCell.className = 'name-col';
      nameCell.rowSpan = 2;
      dayRow.appendChild(nameCell);

      dateOrder.forEach((dateKey) => {
        const dayCell = document.createElement('th');
        dayCell.className = 'day-header';
        dayCell.colSpan = dateGroups.get(dateKey).length;
        dayCell.textContent = formatDate(dateKey);
        dayRow.appendChild(dayCell);
      });

      scheduleHead.appendChild(dayRow);

      const timeRow = document.createElement('tr');
      dateOrder.forEach((dateKey) => {
        dateGroups.get(dateKey).forEach((slot) => {
          const timeCell = document.createElement('th');
          timeCell.className = 'time-header';
          timeCell.textContent = slot.id.slice(11, 16);
          timeCell.title = slot.label;
          timeRow.appendChild(timeCell);
        });
      });

      scheduleHead.appendChild(timeRow);
    }

    function getCurrentParticipantSlots(name, state) {
      const entry = state.participantEntries.find((person) => person.name === name) || { slots: [] };
      const draft = state.participantDraft[name] || [];
      return [...new Set([...entry.slots, ...draft])];
    }

    function renderTable() {
      const state = getState();
      const slots = buildSlots(state.candidateDates);
      scheduleBody.innerHTML = '';

      if (!slots.length) {
        scheduleHead.innerHTML = '';
        const row = document.createElement('tr');
        const empty = document.createElement('td');
        empty.colSpan = 2;
        empty.className = 'empty-state';
        empty.textContent = '候補日を追加すると、ここに予定表が表示されます';
        row.appendChild(empty);
        scheduleBody.appendChild(row);
        return;
      }

      renderHeader(slots);

      const activeName = participantNameInput.value.trim();
      const rows = [...state.participantEntries];

      if (activeName && !rows.some((person) => person.name === activeName)) {
        rows.push({ name: activeName, slots: getCurrentParticipantSlots(activeName, state) });
      }

      rows.forEach((person) => {
        const row = document.createElement('tr');
        const entryName = person.name;
        const displaySlots = getCurrentParticipantSlots(entryName, state);
        const canEdit = activeName === entryName && activeName !== '';

        const nameCell = document.createElement('th');
        nameCell.textContent = entryName;
        nameCell.className = 'person-name';
        row.appendChild(nameCell);

        slots.forEach((slot) => {
          const cell = document.createElement('td');
          const selected = displaySlots.includes(slot.id);

          cell.className = selected ? 'slot selected' : 'slot';
          cell.dataset.person = entryName;
          cell.dataset.slotId = slot.id;
          cell.setAttribute('role', 'button');
          cell.setAttribute('tabindex', '0');
          cell.textContent = selected ? '○' : '';
          cell.title = `${entryName} ${slot.label}`;

          if (canEdit) {
            const handleSelection = () => toggleDraftSlot(entryName, slot.id);
            cell.addEventListener('click', handleSelection);
            cell.addEventListener('keydown', (event) => {
              if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                handleSelection();
              }
            });
          } else {
            cell.style.cursor = 'default';
          }

          row.appendChild(cell);
        });

        scheduleBody.appendChild(row);
      });
    }

    function toggleDraftSlot(name, slotId) {
      const state = getState();
      const cleanName = name.trim();
      if (!cleanName) return;

      if (!state.participantDraft[cleanName]) {
        state.participantDraft[cleanName] = [];
      }

      const slotIndex = state.participantDraft[cleanName].indexOf(slotId);
      if (slotIndex >= 0) {
        state.participantDraft[cleanName].splice(slotIndex, 1);
      } else {
        state.participantDraft[cleanName].push(slotId);
      }

      saveState(state);
      renderTable();
    }

    function saveAvailability() {
      const state = getState();
      const name = participantNameInput.value.trim();
      if (!name) {
        participantNameInput.focus();
        return;
      }

      const draftSlots = state.participantDraft[name] || [];
      const entry = state.participantEntries.find((person) => person.name === name);

      if (entry) {
        entry.slots = [...new Set([...entry.slots, ...draftSlots])];
      } else {
        state.participantEntries.push({ name, slots: [...draftSlots] });
      }

      delete state.participantDraft[name];
      saveState(state);
      renderTable();
    }

    document.querySelectorAll('.nav-button').forEach((button) => {
      button.addEventListener('click', () => {
        const target = button.dataset.target;
        if (target) {
          window.location.href = target;
        }
      });
    });

    saveAvailabilityBtn.addEventListener('click', saveAvailability);
    participantNameInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        saveAvailability();
      }
    });
    participantNameInput.addEventListener('input', renderTable);

    renderCandidateDates();
    renderTable();
  </script>
</body>
</html>
