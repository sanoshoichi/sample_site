<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理者ページ</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* highlight already-registered candidate dates */
    .calendar-day.registered {
      background: linear-gradient(180deg, rgba(212, 165, 87, 0.92), rgba(184, 132, 46, 0.92));
      color: #1d1710;
      border-color: rgba(255, 233, 164, 0.8);
      box-shadow: 0 0 0 2px rgba(255, 214, 122, 0.32);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="page-header">
      <p class="eyebrow">Admin</p>
      <h1>管理者ページ</h1>
      <nav class="page-nav">
        <button type="button" class="nav-button" data-target="index.html">参加者ページへ</button>
      </nav>
    </header>

    <section class="toolbar">
      <div class="date-builder">
        <div class="field">
          <span>候補日を視覚的に選択</span>
          <div class="calendar-controls">
            <button type="button" id="prevMonthBtn" class="calendar-nav" aria-label="前の月">◀</button>
            <div id="calendarLabel" class="calendar-label" aria-live="polite"></div>
            <button type="button" id="nextMonthBtn" class="calendar-nav" aria-label="次の月">▶</button>
          </div>
          <div style="margin-top:8px; display:flex; gap:8px; align-items:center;">
            <label style="color:var(--muted);">予定切替</label>
            <select id="scheduleSelect"></select>
            <button id="newScheduleBtn" type="button" class="nav-button">新規予定</button>
            <button id="deleteScheduleBtn" type="button" class="secondary-btn">削除</button>
          </div>
          <div id="calendarGrid" class="calendar-grid" aria-live="polite"></div>
          <div class="inline-field bulk-register">
            <button id="registerSelectedDatesBtn" type="button">選択した日を一括登録</button>
            <button id="clearSelectedDatesBtn" type="button" class="secondary-btn">選択をクリア</button>
          </div>
        </div>
        <div id="candidateDateList" class="candidate-list" aria-live="polite"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <p class="mini-label">候補日程</p>
          <h2>管理者が日時を設定</h2>
        </div>
      </div>

      <div class="schedule-wrap">
        <table class="schedule-table" aria-label="候補日一覧">
          <thead id="scheduleHead"></thead>
          <tbody id="scheduleBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    
    const STORAGE_KEY = 'scheduleTableData';
    const SUPABASE_URL = 'https://nwyfvlxjkonxpnkhuiuv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_kew3a0QTt7awm_saFyRj_A_Hgb6aQcq';
    const SUPABASE_TABLE = 'schedule_state';
    const HOUR_START = 9;
    const HOUR_END = 20;

    const defaultState = {
      candidateDates: [],
      participantEntries: [
        { name: '', slots: [] }
      ],
      participantDraft: {}
    };

    // Simple admin protection: set a token and/or password.
    // NOTE: This is client-side protection and not secure for sensitive data.
    const ADMIN_TOKEN = 'admin-token-REPLACE_THIS';
    const ADMIN_PASSWORD = 'adminpass';

    function checkAdminAccess() {
      try {
        // Allow opening the page directly from file:// (e.g. VS Code editor) for development convenience
        if (typeof location !== 'undefined' && location.protocol === 'file:') {
          sessionStorage.setItem('isAdmin', '1');
          return true;
        }
        const params = new URLSearchParams(window.location.search);
        const token = params.get('admin_token');
        if (token && token === ADMIN_TOKEN) {
          sessionStorage.setItem('isAdmin', '1');
          return true;
        }
        if (sessionStorage.getItem('isAdmin') === '1') return true;
        const input = window.prompt('管理者パスワードを入力してください');
        if (input === ADMIN_PASSWORD) {
          sessionStorage.setItem('isAdmin', '1');
          return true;
        }
      } catch (e) {
        // ignore
      }
      document.body.innerHTML = '<div style="padding:40px;font-family:system-ui, -apple-system, sans-serif;"><h2>管理者認証が必要です</h2><p>許可されていません。<a href="index.html">参加者ページへ戻る</a></p></div>';
      throw new Error('Unauthorized');
    }

    // enforce admin access on load
    checkAdminAccess();

    const scheduleHead = document.getElementById('scheduleHead');
    const scheduleBody = document.getElementById('scheduleBody');
    const candidateDateList = document.getElementById('candidateDateList');
    const calendarGrid = document.getElementById('calendarGrid');
    const calendarLabel = document.getElementById('calendarLabel');
    const prevMonthBtn = document.getElementById('prevMonthBtn');
    const nextMonthBtn = document.getElementById('nextMonthBtn');
    const registerSelectedDatesBtn = document.getElementById('registerSelectedDatesBtn');
    const clearSelectedDatesBtn = document.getElementById('clearSelectedDatesBtn');

    let selectedDates = [];
    let currentCalendarMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

    function deepClone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function isValidState(value) {
      return value && Array.isArray(value.candidateDates) && Array.isArray(value.participantEntries);
    }

    function migrateSlots(appState) {
      if (!appState) return;

      // If this looks like a legacy schedule payload (candidateDates present), wrap it
      if (isValidState(appState)) {
        // legacy single-payload -> convert to app shape
        const payload = appState;
        appState = {
          schedules: [{ id: 'default', title: 'Default', payload }],
          activeScheduleId: 'default'
        };
      }

      if (Array.isArray(appState.schedules)) {
        appState.schedules = appState.schedules.map((sched) => {
          const state = sched.payload || { candidateDates: [], participantEntries: [], participantDraft: {} };

          state.participantEntries = (state.participantEntries || []).map((person) => {
            const rawSlots = person.slots || [];
            const normalized = rawSlots.map((s) => {
              if (!s) return null;
              if (typeof s === 'string') return { id: s, mark: 'circle' };
              if (typeof s === 'object' && s.id) return s;
              return null;
            }).filter(Boolean);
            return { ...person, slots: normalized };
          });

          const drafts = state.participantDraft || {};
          Object.keys(drafts).forEach((name) => {
            const arr = drafts[name] || [];
            drafts[name] = arr.map((s) => {
              if (!s) return null;
              if (typeof s === 'string') return { id: s, mark: 'circle' };
              if (typeof s === 'object' && s.id) return s;
              return null;
            }).filter(Boolean);
          });

          state.participantDraft = drafts;
          return { ...sched, payload: state };
        });
      }
    }

    function getEmptyAppState() {
      return { schedules: [], activeScheduleId: null };
    }

    function getAppState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return getEmptyAppState();

      try {
        const parsed = JSON.parse(raw);
        // legacy payload -> wrap
        if (isValidState(parsed)) {
          const app = { schedules: [{ id: 'default', title: 'Default', payload: parsed }], activeScheduleId: 'default' };
          migrateSlots(app);
          return app;
        }

        if (parsed && Array.isArray(parsed.schedules)) {
          migrateSlots(parsed);
          return parsed;
        }
      } catch (error) {
        // fall through
      }

      return getEmptyAppState();
    }

    function hasActiveSchedule() {
      const app = getAppState();
      const schedules = app.schedules || [];
      return !!(app.activeScheduleId && schedules.some((schedule) => schedule.id === app.activeScheduleId));
    }

    function getState() {
      const app = getAppState();
      const activeId = app.activeScheduleId;
      const sched = (app.schedules || []).find((s) => s.id === activeId);
      if (!sched) return { candidateDates: [], participantEntries: [], participantDraft: {} };
      return sched.payload;
    }

    async function saveAppState(appState) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));

      if (!SUPABASE_URL || SUPABASE_URL.includes('<Project URL>') || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('<anon public key>')) {
        return;
      }

      try {
        const checkResponse = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?select=id&id=eq.1`, {
          headers: getSupabaseHeaders(),
          cache: 'no-store'
        });

        if (!checkResponse.ok) {
          return;
        }

        const existingRows = await checkResponse.json();
        const hasRow = Array.isArray(existingRows) && existingRows.some((row) => row.id === 1);

        const url = hasRow ? `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?id=eq.1` : `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}`;
        const method = hasRow ? 'PATCH' : 'POST';
        const body = hasRow ? JSON.stringify({ payload: appState }) : JSON.stringify({ id: 1, payload: appState });

        await fetch(url, {
          method,
          headers: {
            ...getSupabaseHeaders(),
            Prefer: hasRow ? 'resolution=merge-duplicates' : 'resolution=merge-duplicates'
          },
          body
        });
      } catch (error) {
        // Ignore network issues and keep local fallback behavior.
      }
    }

    async function saveState(statePayload) {
      const app = getAppState();
      const activeId = app.activeScheduleId || (app.schedules[0] && app.schedules[0].id);
      let sched = (app.schedules || []).find((s) => s.id === activeId);
      if (!sched) {
        sched = { id: activeId || `s_${Date.now()}`, title: activeId || 'New', payload: statePayload };
        app.schedules = app.schedules || [];
        app.schedules.push(sched);
        app.activeScheduleId = sched.id;
      } else {
        sched.payload = statePayload;
      }

      await saveAppState(app);
    }
    function getSupabaseHeaders() {
      return {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json'
      };
    }

    // --- per-schedule CRUD on Supabase 'schedules' table ---
    async function listSchedulesFromServer() {
      if (!SUPABASE_URL || SUPABASE_URL.includes('<Project URL>') || !SUPABASE_ANON_KEY) return null;
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/schedules?select=id,title,payload`, {
          headers: getSupabaseHeaders(),
          cache: 'no-store'
        });
        if (!res.ok) return null;
        const rows = await res.json();
        const app = {
          schedules: (rows || []).map((r) => ({ id: r.id, title: r.title || r.id, payload: r.payload || deepClone(defaultState) })),
          activeScheduleId: (rows && rows[0] && rows[0].id) || null
        };
        migrateSlots(app);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(app));
        return app;
      } catch (e) {
        return null;
      }
    }

    async function upsertScheduleToServer(sched) {
      if (!SUPABASE_URL || SUPABASE_URL.includes('<Project URL>') || !SUPABASE_ANON_KEY) return false;
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/schedules`, {
          method: 'POST',
          headers: { ...getSupabaseHeaders(), Prefer: 'resolution=merge-duplicates' },
          body: JSON.stringify({ id: sched.id, title: sched.title, payload: sched.payload })
        });
        return true;
      } catch (e) {
        return false;
      }
    }

    async function deleteScheduleFromServer(id) {
      if (!SUPABASE_URL || SUPABASE_URL.includes('<Project URL>') || !SUPABASE_ANON_KEY) return false;
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/schedules?id=eq.${encodeURIComponent(id)}`, {
          method: 'DELETE',
          headers: getSupabaseHeaders()
        });
        return true;
      } catch (e) {
        return false;
      }
    }

    async function syncStateFromServer() {
      if (!SUPABASE_URL || SUPABASE_URL.includes('<Project URL>') || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('<anon public key>')) {
        return;
      }

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?select=payload&id=eq.1`, {
          headers: getSupabaseHeaders(),
          cache: 'no-store'
        });

        if (!response.ok) return;

        const rows = await response.json();
        const remoteState = rows && rows[0] ? rows[0].payload : null;

        // accept either legacy single-payload state or app-level state with schedules
        if (remoteState) {
          if (isValidState(remoteState) || (remoteState.schedules && Array.isArray(remoteState.schedules))) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(remoteState));
          }
        }
      } catch (error) {
        // Ignore network errors and continue using local fallback data.
      }
    }

    async function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

      if (!SUPABASE_URL || SUPABASE_URL.includes('<Project URL>') || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('<anon public key>')) {
        return;
      }

      try {
        const checkResponse = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?select=id&id=eq.1`, {
          headers: getSupabaseHeaders(),
          cache: 'no-store'
        });

        if (!checkResponse.ok) {
          return;
        }

        const existingRows = await checkResponse.json();
        const hasRow = Array.isArray(existingRows) && existingRows.some((row) => row.id === 1);

        const url = hasRow ? `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?id=eq.1` : `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}`;
        const method = hasRow ? 'PATCH' : 'POST';
        const body = hasRow ? JSON.stringify({ payload: state }) : JSON.stringify({ id: 1, payload: state });

        await fetch(url, {
          method,
          headers: {
            ...getSupabaseHeaders(),
            Prefer: 'resolution=merge-duplicates'
          },
          body
        });
      } catch (error) {
        // Ignore network issues and keep local fallback behavior.
      }
    }

    function formatDate(dateString) {
      const date = new Date(`${dateString}T00:00:00`);
      return `${date.getMonth() + 1}/${date.getDate()}`;
    }

    function buildSlots(candidateDates) {
      const slots = [];

      candidateDates
        .slice()
        .sort()
        .forEach((dateString) => {
          for (let hour = HOUR_START; hour <= HOUR_END; hour += 1) {
            const iso = `${dateString}T${String(hour).padStart(2, '0')}:00:00`;
            slots.push({
              id: iso,
              label: `${formatDate(dateString)} ${String(hour).padStart(2, '0')}:00`
            });
          }
        });

      return slots;
    }

    function formatDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function renderCandidateDates() {
      if (!hasActiveSchedule()) {
        candidateDateList.innerHTML = '<p class="empty-info">-</p>';
        return;
      }

      const state = getState();
      candidateDateList.innerHTML = '';

      if (!state.candidateDates.length) {
        const empty = document.createElement('p');
        empty.className = 'empty-info';
        empty.textContent = '候補日がまだありません';
        candidateDateList.appendChild(empty);
        return;
      }

      state.candidateDates
        .slice()
        .sort()
        .forEach((dateString) => {
          const pill = document.createElement('button');
          pill.type = 'button';
          pill.className = 'candidate-pill';
          pill.textContent = formatDate(dateString);

          const removeButton = document.createElement('span');
          removeButton.className = 'candidate-remove';
          removeButton.textContent = '×';
          removeButton.setAttribute('aria-label', `${dateString}を削除`);
          removeButton.addEventListener('click', (event) => {
            event.stopPropagation();
            removeCandidateDate(dateString);
          });

          pill.appendChild(removeButton);
          candidateDateList.appendChild(pill);
        });
    }

    function renderCalendar() {
      const registerBtn = document.getElementById('registerSelectedDatesBtn');
      const clearBtn = document.getElementById('clearSelectedDatesBtn');
      const deleteBtn = document.getElementById('deleteScheduleBtn');
      if (registerBtn) registerBtn.disabled = !hasActiveSchedule();
      if (clearBtn) clearBtn.disabled = !hasActiveSchedule();
      if (deleteBtn) deleteBtn.disabled = !hasActiveSchedule();

      if (!hasActiveSchedule()) {
        calendarLabel.textContent = '予定を選択してください';
        calendarGrid.innerHTML = '';
        return;
      }

      const monthStart = new Date(currentCalendarMonth.getFullYear(), currentCalendarMonth.getMonth(), 1);
      const monthEnd = new Date(currentCalendarMonth.getFullYear(), currentCalendarMonth.getMonth() + 1, 0);
      const firstWeekday = monthStart.getDay();
      const daysInMonth = monthEnd.getDate();

      calendarLabel.textContent = `${monthStart.getFullYear()}年 ${monthStart.getMonth() + 1}月`;
      calendarGrid.innerHTML = '';

      const weekdayNames = ['日', '月', '火', '水', '木', '金', '土'];
      weekdayNames.forEach((weekday) => {
        const label = document.createElement('div');
        label.className = 'calendar-weekday';
        label.textContent = weekday;
        calendarGrid.appendChild(label);
      });

      for (let index = 0; index < firstWeekday; index += 1) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'calendar-day empty';
        calendarGrid.appendChild(emptyCell);
      }

      for (let day = 1; day <= daysInMonth; day += 1) {
        const date = new Date(currentCalendarMonth.getFullYear(), currentCalendarMonth.getMonth(), day);
        const dateKey = formatDateKey(date);
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'calendar-day';
        cell.textContent = String(day);
        cell.setAttribute('aria-label', `${dateKey}を選択`);

        if (selectedDates.includes(dateKey)) {
          cell.classList.add('selected');
        }

        // highlight dates already registered for the active schedule
        try {
          const state = getState();
          if (state && Array.isArray(state.candidateDates) && state.candidateDates.includes(dateKey)) {
            cell.classList.add('registered');
          }
        } catch (e) {
          // ignore
        }

        cell.addEventListener('click', () => {
          if (selectedDates.includes(dateKey)) {
            selectedDates = selectedDates.filter((value) => value !== dateKey);
          } else {
            selectedDates.push(dateKey);
          }
          renderCalendar();
        });

        calendarGrid.appendChild(cell);
      }
    }

    function registerSelectedDates() {
      if (!hasActiveSchedule()) return;

      const state = getState();
      const newDates = [...new Set(selectedDates.filter((dateKey) => !state.candidateDates.includes(dateKey)))];

      if (!newDates.length) {
        selectedDates = [];
        renderCalendar();
        return;
      }

      state.candidateDates = [...state.candidateDates, ...newDates].sort();
      saveState(state);
      selectedDates = [];
      renderCandidateDates();
      renderTable();
      renderCalendar();
    }

    function renderHeader(state) {
      scheduleHead.innerHTML = '';
      const headerRow = document.createElement('tr');

      const dateLabelCell = document.createElement('th');
      dateLabelCell.textContent = '日付';
      dateLabelCell.className = 'date-col';
      headerRow.appendChild(dateLabelCell);

      const timeLabelCell = document.createElement('th');
      timeLabelCell.textContent = '時間';
      timeLabelCell.className = 'time-col';
      headerRow.appendChild(timeLabelCell);

      state.participantEntries.forEach((person) => {
        const userCell = document.createElement('th');
        userCell.className = 'day-header';

        const nameWrap = document.createElement('div');
        nameWrap.className = 'person-name-wrap';

        const nameText = document.createElement('span');
        nameText.textContent = person.name;
        nameText.className = 'person-name-text';

        const removeButton = document.createElement('button');
        removeButton.type = 'button';
        removeButton.className = 'person-remove';
        removeButton.textContent = '削除';
        removeButton.setAttribute('aria-label', `${person.name}を削除`);
        removeButton.addEventListener('click', () => removeParticipant(person.name));

        nameWrap.appendChild(nameText);
        nameWrap.appendChild(removeButton);
        userCell.appendChild(nameWrap);
        headerRow.appendChild(userCell);
      });

      scheduleHead.appendChild(headerRow);
    }

    function renderTable() {
      if (!hasActiveSchedule()) {
        scheduleHead.innerHTML = '';
        scheduleBody.innerHTML = '<tr><td class="empty-state" colspan="2">-</td></tr>';
        return;
      }

      const state = getState();
      const slots = buildSlots(state.candidateDates);
      scheduleBody.innerHTML = '';

      if (!slots.length) {
        scheduleHead.innerHTML = '';
        const row = document.createElement('tr');
        const empty = document.createElement('td');
        empty.colSpan = 2;
        empty.className = 'empty-state';
        empty.textContent = '候補日を追加すると、ここに予定表が表示されます';
        row.appendChild(empty);
        scheduleBody.appendChild(row);
        return;
      }

      renderHeader(state);

      const dateGroups = new Map();
      const dateOrder = [];

      slots.forEach((slot) => {
        const dateKey = slot.id.slice(0, 10);
        if (!dateGroups.has(dateKey)) {
          dateGroups.set(dateKey, []);
          dateOrder.push(dateKey);
        }
        dateGroups.get(dateKey).push(slot);
      });

      dateOrder.forEach((dateKey) => {
        const daySlots = dateGroups.get(dateKey);

        daySlots.forEach((slot, index) => {
          const row = document.createElement('tr');

          if (index === 0) {
            const dateCell = document.createElement('th');
            dateCell.className = 'date-cell';
            dateCell.rowSpan = daySlots.length;
            dateCell.textContent = formatDate(dateKey);
            dateCell.title = dateKey;
            row.appendChild(dateCell);
          }

          const timeCell = document.createElement('th');
          timeCell.className = 'time-header';
          timeCell.textContent = slot.id.slice(11, 16);
          timeCell.title = slot.label;
          row.appendChild(timeCell);

          state.participantEntries.forEach((person) => {
            const cell = document.createElement('td');
            // person.slots may be array of strings (old) or objects {id, mark}
            const found = (person.slots || []).find((s) => (typeof s === 'string' ? s === slot.id : (s && s.id === slot.id)));
            const selected = !!found;

            const markClass = (found && typeof found === 'object' && found.mark) ? ` mark-${found.mark}` : '';
            cell.className = (selected ? 'slot selected' : 'slot') + markClass;
            // if object exists and has mark, display corresponding symbol
            if (found && typeof found === 'object' && found.mark) {
              const map = { circle: '○', triangle: '△', cross: '×' };
              cell.textContent = map[found.mark] || '';
            } else {
              cell.textContent = selected ? '○' : '';
            }
            cell.title = `${person.name} ${slot.label}`;
            cell.style.cursor = 'default';
            row.appendChild(cell);
          });

          scheduleBody.appendChild(row);
        });
      });
    }

    function removeParticipant(name) {
      if (!hasActiveSchedule()) return;

      const confirmed = window.confirm(`${name} を削除してもよろしいですか？`);
      if (!confirmed) return;

      const state = getState();
      state.participantEntries = state.participantEntries.filter((person) => person.name !== name);
      if (state.participantDraft && state.participantDraft[name]) {
        delete state.participantDraft[name];
      }
      saveState(state);
      renderTable();
    }

    function addCandidateDate(dateString) {
      if (!dateString || !hasActiveSchedule()) return;

      const state = getState();
      if (state.candidateDates.includes(dateString)) {
        return;
      }

      state.candidateDates.push(dateString);
      state.candidateDates.sort();
      saveState(state);
      renderCandidateDates();
      renderTable();
    }

    function removeCandidateDate(dateString) {
      if (!hasActiveSchedule()) return;

      const state = getState();
      state.candidateDates = state.candidateDates.filter((date) => date !== dateString);
      state.participantEntries.forEach((person) => {
        person.slots = (person.slots || []).filter((slot) => {
          if (!slot) return false;
          if (typeof slot === 'string') return !slot.startsWith(`${dateString}T`);
          if (typeof slot === 'object' && slot.id) return !slot.id.startsWith(`${dateString}T`);
          return false;
        });
      });
      Object.keys(state.participantDraft || {}).forEach((name) => {
        state.participantDraft[name] = (state.participantDraft[name] || []).filter((slot) => {
          if (!slot) return false;
          if (typeof slot === 'string') return !slot.startsWith(`${dateString}T`);
          if (typeof slot === 'object' && slot.id) return !slot.id.startsWith(`${dateString}T`);
          return false;
        });
      });
      saveState(state);
      renderCandidateDates();
      renderTable();
    }

    document.querySelectorAll('.nav-button').forEach((button) => {
      button.addEventListener('click', () => {
        const target = button.dataset.target;
        if (target) {
          window.location.href = target;
        }
      });
    });

    prevMonthBtn.addEventListener('click', () => {
      currentCalendarMonth = new Date(currentCalendarMonth.getFullYear(), currentCalendarMonth.getMonth() - 1, 1);
      renderCalendar();
    });

    nextMonthBtn.addEventListener('click', () => {
      currentCalendarMonth = new Date(currentCalendarMonth.getFullYear(), currentCalendarMonth.getMonth() + 1, 1);
      renderCalendar();
    });

    registerSelectedDatesBtn.addEventListener('click', registerSelectedDates);
    clearSelectedDatesBtn.addEventListener('click', () => {
      selectedDates = [];
      renderCalendar();
    });

    function renderScheduleSelector() {
      const select = document.getElementById('scheduleSelect');
      if (!select) return;
      const app = getAppState();
      select.innerHTML = '';

      if (!app.schedules || !app.schedules.length) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = '-';
        opt.selected = true;
        select.appendChild(opt);
        select.disabled = true;
        return;
      }

      select.disabled = false;
      (app.schedules || []).forEach((s) => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.title || s.id;
        if (app.activeScheduleId === s.id) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function createNewSchedule() {
      const title = window.prompt('新しい予定のタイトルを入力してください');
      if (!title) return;
      const app = getAppState();
      const id = `s_${Date.now()}`;
      const payload = deepClone(defaultState);
      const sched = { id, title, payload };
      app.schedules = app.schedules || [];
      app.schedules.push(sched);
      app.activeScheduleId = id;
      saveAppState(app).then(async () => {
        await upsertScheduleToServer(sched);
        renderScheduleSelector();
        renderCandidateDates();
        renderTable();
        renderCalendar();
        const url = new URL(window.location.href);
        url.searchParams.set('admin_token', ADMIN_TOKEN);
        try { navigator.clipboard.writeText(url.toString()); } catch (e) {}
        alert('新しい予定を作成しました。共有用の管理URL（クリップボードにコピー）を発行しました。');
      });
    }

    function deleteCurrentSchedule() {
      const app = getAppState();
      const id = app.activeScheduleId;
      if (!id) return;
      const sched = (app.schedules || []).find((s) => s.id === id);
      if (!sched) return;
      const ok = window.confirm(`${sched.title || sched.id} を削除してもよろしいですか？`);
      if (!ok) return;

      app.schedules = (app.schedules || []).filter((s) => s.id !== id);
      app.activeScheduleId = app.schedules.length ? app.schedules[0].id : null;
      saveAppState(app).then(async () => {
        if (id) await deleteScheduleFromServer(id);
        renderScheduleSelector();
        renderCandidateDates();
        renderTable();
        renderCalendar();
      });
    }

    document.getElementById('newScheduleBtn').addEventListener('click', createNewSchedule);
    document.getElementById('deleteScheduleBtn').addEventListener('click', deleteCurrentSchedule);
    document.getElementById('scheduleSelect').addEventListener('change', (e) => {
      const app = getAppState();
      app.activeScheduleId = e.target.value || null;
      saveAppState(app).then(() => {
        renderCandidateDates();
        renderTable();
        renderCalendar();
      });
    });

    // prefer per-schedule server list when available
    (async () => {
      const app = await listSchedulesFromServer();
      if (app) {
        renderScheduleSelector();
        renderCandidateDates();
        renderCalendar();
        renderTable();
      } else {
        syncStateFromServer();
        renderScheduleSelector();
        renderCandidateDates();
        renderCalendar();
        renderTable();
      }
    })();
  </script>
</body>
</html>
