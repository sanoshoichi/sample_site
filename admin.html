<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理者ページ</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="page-header">
      <p class="eyebrow">Admin</p>
      <h1>管理者ページ</h1>
      <nav class="page-nav">
        <button type="button" class="nav-button" data-target="index.html">参加者ページへ</button>
      </nav>
    </header>

    <section class="toolbar">
      <div class="date-builder">
        <div class="field">
          <span>候補日を視覚的に選択</span>
          <div class="calendar-controls">
            <button type="button" id="prevMonthBtn" class="calendar-nav" aria-label="前の月">◀</button>
            <div id="calendarLabel" class="calendar-label" aria-live="polite"></div>
            <button type="button" id="nextMonthBtn" class="calendar-nav" aria-label="次の月">▶</button>
          </div>
          <div id="calendarGrid" class="calendar-grid" aria-live="polite"></div>
          <div class="inline-field bulk-register">
            <button id="registerSelectedDatesBtn" type="button">選択した日を一括登録</button>
            <button id="clearSelectedDatesBtn" type="button" class="secondary-btn">選択をクリア</button>
          </div>
        </div>
        <div id="candidateDateList" class="candidate-list" aria-live="polite"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <p class="mini-label">候補日程</p>
          <h2>管理者が日時を設定</h2>
        </div>
      </div>

      <div class="schedule-wrap">
        <table class="schedule-table" aria-label="候補日一覧">
          <thead id="scheduleHead"></thead>
          <tbody id="scheduleBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    
    const STORAGE_KEY = 'scheduleTableData';
    const SUPABASE_URL = 'https://nwyfvlxjkonxpnkhuiuv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_kew3a0QTt7awm_saFyRj_A_Hgb6aQcq';
    const SUPABASE_TABLE = 'schedule_state';
    const HOUR_START = 9;
    const HOUR_END = 20;

    const defaultState = {
      candidateDates: [],
      participantEntries: [
        { name: 'TESTUSER', slots: [] }
      ],
      participantDraft: {}
    };

    const scheduleHead = document.getElementById('scheduleHead');
    const scheduleBody = document.getElementById('scheduleBody');
    const candidateDateList = document.getElementById('candidateDateList');
    const calendarGrid = document.getElementById('calendarGrid');
    const calendarLabel = document.getElementById('calendarLabel');
    const prevMonthBtn = document.getElementById('prevMonthBtn');
    const nextMonthBtn = document.getElementById('nextMonthBtn');
    const registerSelectedDatesBtn = document.getElementById('registerSelectedDatesBtn');
    const clearSelectedDatesBtn = document.getElementById('clearSelectedDatesBtn');

    let selectedDates = [];
    let currentCalendarMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

    function deepClone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function isValidState(value) {
      return value && Array.isArray(value.candidateDates) && Array.isArray(value.participantEntries);
    }

    function getState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return deepClone(defaultState);

      try {
        const parsed = JSON.parse(raw);
        if (isValidState(parsed)) {
          return parsed;
        }
      } catch (error) {
        // Ignore invalid state and fall back to defaults.
      }

      return deepClone(defaultState);
    }

    function getSupabaseHeaders() {
      return {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json'
      };
    }

    async function syncStateFromServer() {
      if (!SUPABASE_URL || SUPABASE_URL.includes('<Project URL>') || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('<anon public key>')) {
        return;
      }

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?select=payload&id=eq.1`, {
          headers: getSupabaseHeaders(),
          cache: 'no-store'
        });

        if (!response.ok) return;

        const rows = await response.json();
        const remoteState = rows && rows[0] ? rows[0].payload : null;

        if (isValidState(remoteState)) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(remoteState));
        }
      } catch (error) {
        // Ignore network errors and continue using local fallback data.
      }
    }

    async function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

      if (!SUPABASE_URL || SUPABASE_URL.includes('<Project URL>') || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('<anon public key>')) {
        return;
      }

      try {
        const checkResponse = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?select=id&id=eq.1`, {
          headers: getSupabaseHeaders(),
          cache: 'no-store'
        });

        if (!checkResponse.ok) {
          return;
        }

        const existingRows = await checkResponse.json();
        const hasRow = Array.isArray(existingRows) && existingRows.some((row) => row.id === 1);

        const url = hasRow ? `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?id=eq.1` : `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}`;
        const method = hasRow ? 'PATCH' : 'POST';
        const body = hasRow ? JSON.stringify({ payload: state }) : JSON.stringify({ id: 1, payload: state });

        await fetch(url, {
          method,
          headers: {
            ...getSupabaseHeaders(),
            Prefer: 'resolution=merge-duplicates'
          },
          body
        });
      } catch (error) {
        // Ignore network issues and keep local fallback behavior.
      }
    }

    function formatDate(dateString) {
      const date = new Date(`${dateString}T00:00:00`);
      return `${date.getMonth() + 1}/${date.getDate()}`;
    }

    function buildSlots(candidateDates) {
      const slots = [];

      candidateDates
        .slice()
        .sort()
        .forEach((dateString) => {
          for (let hour = HOUR_START; hour <= HOUR_END; hour += 1) {
            const iso = `${dateString}T${String(hour).padStart(2, '0')}:00:00`;
            slots.push({
              id: iso,
              label: `${formatDate(dateString)} ${String(hour).padStart(2, '0')}:00`
            });
          }
        });

      return slots;
    }

    function formatDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function renderCandidateDates() {
      const state = getState();
      candidateDateList.innerHTML = '';

      if (!state.candidateDates.length) {
        const empty = document.createElement('p');
        empty.className = 'empty-info';
        empty.textContent = '候補日がまだありません';
        candidateDateList.appendChild(empty);
        return;
      }

      state.candidateDates
        .slice()
        .sort()
        .forEach((dateString) => {
          const pill = document.createElement('button');
          pill.type = 'button';
          pill.className = 'candidate-pill';
          pill.textContent = formatDate(dateString);

          const removeButton = document.createElement('span');
          removeButton.className = 'candidate-remove';
          removeButton.textContent = '×';
          removeButton.setAttribute('aria-label', `${dateString}を削除`);
          removeButton.addEventListener('click', (event) => {
            event.stopPropagation();
            removeCandidateDate(dateString);
          });

          pill.appendChild(removeButton);
          candidateDateList.appendChild(pill);
        });
    }

    function renderCalendar() {
      const monthStart = new Date(currentCalendarMonth.getFullYear(), currentCalendarMonth.getMonth(), 1);
      const monthEnd = new Date(currentCalendarMonth.getFullYear(), currentCalendarMonth.getMonth() + 1, 0);
      const firstWeekday = monthStart.getDay();
      const daysInMonth = monthEnd.getDate();

      calendarLabel.textContent = `${monthStart.getFullYear()}年 ${monthStart.getMonth() + 1}月`;
      calendarGrid.innerHTML = '';

      const weekdayNames = ['日', '月', '火', '水', '木', '金', '土'];
      weekdayNames.forEach((weekday) => {
        const label = document.createElement('div');
        label.className = 'calendar-weekday';
        label.textContent = weekday;
        calendarGrid.appendChild(label);
      });

      for (let index = 0; index < firstWeekday; index += 1) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'calendar-day empty';
        calendarGrid.appendChild(emptyCell);
      }

      for (let day = 1; day <= daysInMonth; day += 1) {
        const date = new Date(currentCalendarMonth.getFullYear(), currentCalendarMonth.getMonth(), day);
        const dateKey = formatDateKey(date);
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'calendar-day';
        cell.textContent = String(day);
        cell.setAttribute('aria-label', `${dateKey}を選択`);

        if (selectedDates.includes(dateKey)) {
          cell.classList.add('selected');
        }

        cell.addEventListener('click', () => {
          if (selectedDates.includes(dateKey)) {
            selectedDates = selectedDates.filter((value) => value !== dateKey);
          } else {
            selectedDates.push(dateKey);
          }
          renderCalendar();
        });

        calendarGrid.appendChild(cell);
      }
    }

    function registerSelectedDates() {
      const state = getState();
      const newDates = [...new Set(selectedDates.filter((dateKey) => !state.candidateDates.includes(dateKey)))];

      if (!newDates.length) {
        selectedDates = [];
        renderCalendar();
        return;
      }

      state.candidateDates = [...state.candidateDates, ...newDates].sort();
      saveState(state);
      selectedDates = [];
      renderCandidateDates();
      renderTable();
      renderCalendar();
    }

    function renderHeader(state) {
      scheduleHead.innerHTML = '';
      const headerRow = document.createElement('tr');
      const timeLabelCell = document.createElement('th');
      timeLabelCell.textContent = '日時';
      timeLabelCell.className = 'name-col';
      headerRow.appendChild(timeLabelCell);

      state.participantEntries.forEach((person) => {
        const userCell = document.createElement('th');
        userCell.className = 'day-header';

        const nameWrap = document.createElement('div');
        nameWrap.className = 'person-name-wrap';

        const nameText = document.createElement('span');
        nameText.textContent = person.name;
        nameText.className = 'person-name-text';

        const removeButton = document.createElement('button');
        removeButton.type = 'button';
        removeButton.className = 'person-remove';
        removeButton.textContent = '削除';
        removeButton.setAttribute('aria-label', `${person.name}を削除`);
        removeButton.addEventListener('click', () => removeParticipant(person.name));

        nameWrap.appendChild(nameText);
        nameWrap.appendChild(removeButton);
        userCell.appendChild(nameWrap);
        headerRow.appendChild(userCell);
      });

      scheduleHead.appendChild(headerRow);
    }

    function renderTable() {
      const state = getState();
      const slots = buildSlots(state.candidateDates);
      scheduleBody.innerHTML = '';

      if (!slots.length) {
        scheduleHead.innerHTML = '';
        const row = document.createElement('tr');
        const empty = document.createElement('td');
        empty.colSpan = 2;
        empty.className = 'empty-state';
        empty.textContent = '候補日を追加すると、ここに予定表が表示されます';
        row.appendChild(empty);
        scheduleBody.appendChild(row);
        return;
      }

      renderHeader(state);

      slots.forEach((slot) => {
        const row = document.createElement('tr');
        const slotLabel = document.createElement('th');
        slotLabel.className = 'time-header';
        slotLabel.textContent = `${formatDate(slot.id.slice(0, 10))} ${slot.id.slice(11, 16)}`;
        slotLabel.title = slot.label;
        row.appendChild(slotLabel);

        state.participantEntries.forEach((person) => {
          const cell = document.createElement('td');
          const selected = person.slots.includes(slot.id);

          cell.className = selected ? 'slot selected' : 'slot';
          cell.textContent = selected ? '○' : '';
          cell.title = `${person.name} ${slot.label}`;
          cell.style.cursor = 'default';
          row.appendChild(cell);
        });

        scheduleBody.appendChild(row);
      });
    }

    function removeParticipant(name) {
      const confirmed = window.confirm(`${name} を削除してもよろしいですか？`);
      if (!confirmed) return;

      const state = getState();
      state.participantEntries = state.participantEntries.filter((person) => person.name !== name);
      if (state.participantDraft && state.participantDraft[name]) {
        delete state.participantDraft[name];
      }
      saveState(state);
      renderTable();
    }

    function addCandidateDate(dateString) {
      if (!dateString) return;

      const state = getState();
      if (state.candidateDates.includes(dateString)) {
        return;
      }

      state.candidateDates.push(dateString);
      state.candidateDates.sort();
      saveState(state);
      renderCandidateDates();
      renderTable();
    }

    function removeCandidateDate(dateString) {
      const state = getState();
      state.candidateDates = state.candidateDates.filter((date) => date !== dateString);
      state.participantEntries.forEach((person) => {
        person.slots = person.slots.filter((slot) => !slot.startsWith(`${dateString}T`));
      });
      Object.keys(state.participantDraft || {}).forEach((name) => {
        state.participantDraft[name] = (state.participantDraft[name] || []).filter((slot) => !slot.startsWith(`${dateString}T`));
      });
      saveState(state);
      renderCandidateDates();
      renderTable();
    }

    document.querySelectorAll('.nav-button').forEach((button) => {
      button.addEventListener('click', () => {
        const target = button.dataset.target;
        if (target) {
          window.location.href = target;
        }
      });
    });

    prevMonthBtn.addEventListener('click', () => {
      currentCalendarMonth = new Date(currentCalendarMonth.getFullYear(), currentCalendarMonth.getMonth() - 1, 1);
      renderCalendar();
    });

    nextMonthBtn.addEventListener('click', () => {
      currentCalendarMonth = new Date(currentCalendarMonth.getFullYear(), currentCalendarMonth.getMonth() + 1, 1);
      renderCalendar();
    });

    registerSelectedDatesBtn.addEventListener('click', registerSelectedDates);
    clearSelectedDatesBtn.addEventListener('click', () => {
      selectedDates = [];
      renderCalendar();
    });

    syncStateFromServer();
    renderCandidateDates();
    renderCalendar();
    renderTable();
  </script>
</body>
</html>
